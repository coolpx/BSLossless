name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve release metadata
        id: vars
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git fetch origin "+refs/heads/*:refs/remotes/origin/*"

          $branches = git for-each-ref --format='%(refname:short)' refs/remotes/origin --points-at $env:GITHUB_SHA |
            ForEach-Object { $_ -replace '^origin/', '' } |
            Where-Object { $_ -match '^\d+\.\d+\.\d+$' }

          if (-not $branches) {
            $branches = git for-each-ref --format='%(refname:short)' refs/remotes/origin --contains $env:GITHUB_SHA |
              ForEach-Object { $_ -replace '^origin/', '' } |
              Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
          }

          $gameVersion = $branches | Select-Object -First 1
          if (-not $gameVersion) {
            throw "No Beat Saber version branch found for $env:GITHUB_SHA."
          }

          $pluginVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $assetName = "BSLossless-v$pluginVersion-bs$gameVersion.zip"
          $releaseName = "BSLossless v$pluginVersion for Beat Saber $gameVersion"

          "game_version=$gameVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "plugin_version=$pluginVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Fetch Beat Saber refs
        id: refs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $refsDir = Join-Path $env:GITHUB_WORKSPACE "Refs"
          if (Test-Path $refsDir) {
            Remove-Item -Recurse -Force $refsDir
          }

          git clone --depth 1 --branch "version/${{ steps.vars.outputs.game_version }}" https://github.com/beat-forge/beatsaber-stripped.git $refsDir
          "refs_dir=$refsDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore packages
        shell: pwsh
        run: dotnet restore BSLossless.sln

      - name: Build release
        shell: pwsh
        env:
          BSSIDECAR_GAME_VERSION: ${{ steps.vars.outputs.game_version }}
        run: dotnet build BSLossless.sln -c Release --no-restore -p:DisableCopyToGame=True -p:DisableZipRelease=True -p:GameDirectory="${{ steps.refs.outputs.refs_dir }}"

      - name: Pack release zip
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "bin\\Release\\Artifact"
          $manifestPath = Join-Path $env:GITHUB_WORKSPACE "manifest.json"
          $zipPath = Join-Path $env:RUNNER_TEMP "${{ steps.vars.outputs.asset_name }}"

          if (-not (Test-Path $artifactDir)) {
            throw "Artifact directory missing: $artifactDir"
          }

          Copy-Item $manifestPath (Join-Path $artifactDir "manifest.json") -Force

          if (Test-Path $zipPath) {
            Remove-Item -Force $zipPath
          }

          Compress-Archive -Path (Join-Path $artifactDir "*") -DestinationPath $zipPath
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Generate changelog
        id: changelog
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $prevTag = git tag --sort=-creatordate | Select-Object -First 1 | Where-Object { $_ -ne $env:GITHUB_REF_NAME }
          if ($prevTag) {
            $range = "$prevTag..HEAD"
          } else {
            $range = "HEAD"
          }
          $commits = git log $range --pretty=format:"- %s" 2>$null
          if (-not $commits) {
            $commits = "- No commits found."
          }
          $commits = ($commits | Out-String).Trim()
          $notes = "Beat Saber ${{ steps.vars.outputs.game_version }} build.`n`n$commits"
          $notesPath = Join-Path $env:RUNNER_TEMP "release_notes.txt"
          $notes | Out-File -FilePath $notesPath -Encoding utf8
          "notes_path=$notesPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME "${{ steps.pack.outputs.zip_path }}#${{ steps.vars.outputs.asset_name }}" --title "${{ steps.vars.outputs.release_name }}" --notes-file "${{ steps.changelog.outputs.notes_path }}"
